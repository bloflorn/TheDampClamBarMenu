<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Damp Clam — Inventory Addition</title>
  <link rel="icon" type="image/jpeg" href="../logo.jpg" />
  <style>
    :root {
      --bg-dark: #03140f;
      --bg-gradient: linear-gradient(135deg, #0d2822 0%, #03140f 100%);
      --card-bg: rgba(2, 22, 17, 0.92);
      --neon-cyan: #00f7ff;
      --neon-green: #39ff14;
      --neon-gold: #ffd700;
      --neon-pink: #ff2a8d;
      --gold-amber: #e5b567;
      --border: #16382c;
      --font-serif: "Georgia", Times, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: #f8fafc;
      font-family: var(--font-sans);
      padding: 1rem;
      min-height: 100vh;
    }
    .container { max-width: 600px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.25rem; }
    h1 { font-family: var(--font-serif); font-size: 1.5rem; color: #fff; text-transform: uppercase; letter-spacing: 0.1em; text-shadow: 0 0 10px var(--neon-cyan); }
    .sub { font-size: 0.8rem; color: var(--gold-amber); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    label { display: block; font-family: var(--font-serif); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-amber); margin-bottom: 4px; font-weight: 600; }
    input[type="text"], input[type="number"], select, textarea, input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #01130d;
      color: #fff;
      font-size: 0.88rem;
      margin-bottom: 0.75rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0,247,255,0.4); }
    
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 14px;
      border-radius: 25px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
      text-align: center;
    }
    .btn-camera { background: var(--neon-cyan); color: #03140f; box-shadow: 0 0 12px rgba(0,247,255,0.4); }
    .btn-camera:hover { background: #fff; box-shadow: 0 0 18px rgba(0,247,255,0.8); }
    .btn-manual { background: rgba(0, 247, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
    .btn-manual:hover { background: rgba(0, 247, 255, 0.25); }
    
    .btn-save { background: var(--neon-green); color: #03140f; box-shadow: 0 0 12px rgba(57,255,20,0.4); margin-top: 0.5rem; }
    .btn-save:hover { background: #fff; box-shadow: 0 0 18px rgba(57,255,20,0.8); }
    .btn-secondary { background: transparent; color: var(--gold-amber); border: 1px solid var(--gold-amber); margin-top: 0.5rem; }
    
    .status-msg { text-align: center; font-size: 0.85rem; margin: 0.75rem 0; font-style: italic; }
    .status-msg.loading { color: var(--neon-cyan); }
    .status-msg.success { color: var(--neon-green); font-weight: bold; }
    .status-msg.error { color: #ff3344; font-weight: bold; }
    
    .preview-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 0.75rem; display: none; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .full-width { grid-column: 1 / -1; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .checkbox-row input { width: auto; margin-bottom: 0; }

    /* Similarity Alert Banner */
    .match-box {
      background: rgba(229, 181, 103, 0.1);
      border: 1px solid var(--gold-amber);
      border-radius: 8px;
      padding: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
    .match-header {
      font-size: 0.8rem;
      color: var(--gold-amber);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.5rem;
    }
    .match-item {
      background: #01130d;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .match-name { font-size: 0.85rem; font-weight: 600; color: #fff; }
    .match-sub { font-size: 0.72rem; color: #94a3b8; }
    .btn-match-action {
      font-size: 0.7rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: var(--neon-cyan);
      color: #03140f;
    }
    .btn-match-action:hover { background: #fff; }
  </style>
  </head>
<body>
  <div class="container">
    <header>
      <h1>Quick Bottle Ingestion</h1>
      <div class="sub">Direct Bar Inventory Manager</div>
    </header>

    <div class="card">
      <div style="margin-bottom: 0.75rem;">
        <label for="gemini-key">Gemini AI Studio Key (For Photo Scan)</label>
        <input type="password" id="gemini-key" placeholder="AIzaSy..." />

        <label for="gh-token">GitHub Token (For Saving to Site)</label>
        <input type="password" id="gh-token" placeholder="ghp_..." />
      </div>

      <div class="action-grid">
        <button class="btn btn-camera" id="capture-btn">📷 Scan Photo</button>
        <button class="btn btn-manual" id="manual-btn">✍️ Manual Add</button>
      </div>

      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;" />
      <img id="image-preview" class="preview-img" alt="Bottle Label" />
      <div id="status-display" class="status-msg"></div>
    </div>

    <!-- Review / Manual Form -->
    <form id="bottle-form" class="card" style="display: none;">
      <!-- Similar Match Container -->
      <div class="match-box" id="similar-matches-box">
        <div class="match-header">🔍 Existing Bottle Match Found</div>
        <div id="matches-list"></div>
      </div>

      <h2 style="font-family: var(--font-serif); font-size: 1.1rem; color: #fff; margin-bottom: 1rem; text-transform: uppercase;">Bottle Details</h2>
      
      <div class="form-grid">
        <div class="full-width">
          <label>Bottle Name *</label>
          <input type="text" id="b-name" placeholder="e.g. Eagle Rare 10-Year" required />
        </div>
        <div>
          <label>Category</label>
          <select id="b-category">
            <option>Bourbon & American Whiskey</option>
            <option>Scotch Whisky</option>
            <option>Irish Whiskey</option>
            <option>Rum & Aquavit</option>
            <option>Gin, Vodka & Liqueurs</option>
            <option>Wine</option>
          </select>
        </div>
        <div>
          <label>Sub-Category / Style</label>
          <input type="text" id="b-sub" placeholder="e.g. Straight Bourbon or Cabernet Sauvignon" />
        </div>
        <div>
          <label>Proof / ABV</label>
          <input type="text" id="b-proof" placeholder="e.g. 90 Proof (45% ABV)" />
        </div>
        <div>
          <label>Bottle Size / Unit</label>
          <input type="text" id="b-size" value="750 mL" />
        </div>
        <div>
          <label>Quantity in Stock</label>
          <input type="number" id="b-qty" value="1" min="1" />
        </div>
        <div class="full-width">
          <label>Details / Bottler / Distiller / Vineyard</label>
          <input type="text" id="b-details" placeholder="e.g. Kentucky Straight Bourbon, Aged 10 Years" />
        </div>
        <div class="full-width">
          <label>Tasting Notes</label>
          <textarea id="b-notes" rows="2" placeholder="Toasted oak, vanilla, rich caramel, and cherries."></textarea>
        </div>
        <div>
          <label>Mashbill / Botanicals / Origin (Optional)</label>
          <input type="text" id="b-mash" placeholder="e.g. Buffalo Trace Mash #1 or Napa Valley, CA" />
        </div>
        <div>
          <label>Barrel / Cask (Optional)</label>
          <input type="text" id="b-barrel" placeholder="e.g. French Oak Casks" />
        </div>
        <div class="full-width checkbox-row">
          <input type="checkbox" id="b-special" />
          <label for="b-special" style="margin-bottom:0; cursor:pointer;">Mark as Special / Reserve Bottle?</label>
        </div>
        <div class="full-width checkbox-row">
          <input type="checkbox" id="b-gifted" />
          <label for="b-gifted" style="margin-bottom:0; cursor:pointer;">Mark as Gifted Bottle?</label>
        </div>
        <div class="full-width" id="gift-notes-row" style="display: none;">
          <label>Gift Story / Occasion</label>
          <input type="text" id="b-giftnotes" placeholder="e.g. Gifted for anniversary." />
        </div>
      </div>

      <button type="submit" class="btn btn-save" id="save-btn">✓ Save as New Card</button>
      <a href="manager.html" class="btn btn-secondary">Go to Bar Manager</a>
    </form>
  </div>

  <script>
    const REPO = "thedampclam/TheDampClamBarMenu";
    
    let existingSpirits = [];

    const storedGemini = localStorage.getItem("damp_clam_gemini_key");
    if (storedGemini) document.getElementById("gemini-key").value = storedGemini;

    const storedGh = localStorage.getItem("decap-cms-user");
    if (storedGh) {
      try {
        const parsed = JSON.parse(storedGh);
        if (parsed.token) document.getElementById("gh-token").value = parsed.token;
      } catch (e) {}
    }

    async function preloadInventory() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${REPO}/main/data/spirits.json`);
        const data = await res.json();
        existingSpirits = data.items || [];
      } catch(e) {
        console.warn("Could not pre-fetch spirits list:", e);
      }
    }
    preloadInventory();

    const captureBtn = document.getElementById("capture-btn");
    const manualBtn = document.getElementById("manual-btn");
    const cameraInput = document.getElementById("camera-input");
    const preview = document.getElementById("image-preview");
    const statusDisplay = document.getElementById("status-display");
    const bottleForm = document.getElementById("bottle-form");
    const giftedCheckbox = document.getElementById("b-gifted");
    const giftNotesRow = document.getElementById("gift-notes-row");
    const nameInput = document.getElementById("b-name");

    giftedCheckbox.addEventListener("change", () => {
      giftNotesRow.style.display = giftedCheckbox.checked ? "block" : "none";
    });

    nameInput.addEventListener("input", () => {
      checkForSimilarBottles(nameInput.value.trim());
    });

    manualBtn.addEventListener("click", () => {
      saveKeys();
      bottleForm.style.display = "block";
      statusDisplay.textContent = "";
      preview.style.display = "none";
      bottleForm.scrollIntoView({ behavior: 'smooth' });
    });

    captureBtn.addEventListener("click", () => {
      const gKey = document.getElementById("gemini-key").value.trim();
      if (!gKey) {
        alert("Please paste your Gemini API Key first.");
        return;
      }
      saveKeys();
      cameraInput.click();
    });

    function saveKeys() {
      const gKey = document.getElementById("gemini-key").value.trim();
      const ghKey = document.getElementById("gh-token").value.trim();
      if (gKey) localStorage.setItem("damp_clam_gemini_key", gKey);
      if (ghKey) localStorage.setItem("decap-cms-user", JSON.stringify({ token: ghKey, backendName: "github" }));
    }

    cameraInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = "block";
      statusDisplay.className = "status-msg loading";
      statusDisplay.textContent = "Resizing & analyzing bottle label...";

      try {
        const base64Data = await resizeImageToBase64(file, 1200);
        analyzeBottleLabel(base64Data);
      } catch (err) {
        console.error(err);
        statusDisplay.className = "status-msg error";
        statusDisplay.textContent = "Image processing failed. You can use Manual Add below.";
        bottleForm.style.display = "block";
      }
    });

    function resizeImageToBase64(file, maxDimension) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (readerEvent) => {
          const image = new Image();
          image.onload = () => {
            let width = image.width;
            let height = image.height;
            if (width > height) {
              if (width > maxDimension) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              }
            } else {
              if (height > maxDimension) {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(image, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            resolve(dataUrl.split(",")[1]);
          };
          image.onerror = reject;
          image.src = readerEvent.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function analyzeBottleLabel(base64Data) {
      const gKey = document.getElementById("gemini-key").value.trim();
      const prompt = `Analyze this beverage bottle photo (liquor, wine, or beer). Extract details and return ONLY a valid JSON object matching this schema without markdown fences:
      {
        "name": "Full Product/Bottle Name",
        "category": "One of: Bourbon & American Whiskey, Scotch Whisky, Irish Whiskey, Rum & Aquavit, Gin, Vodka & Liqueurs, Wine",
        "subCategory": "e.g. Straight Bourbon, Speyside, Cabernet Sauvignon, Pinot Noir, Liqueur, etc.",
        "proof": "e.g. 90 Proof (45% ABV) or 13.5% ABV",
        "size": "e.g. 750 mL or Bottle",
        "details": "e.g. Producer, Vintage, Estate, or Distiller info",
        "mash": "Region / Appellation / Mashbill / Botanicals",
        "barrel": "Oak / Barrel aging notes if listed",
        "notes": "Tasting notes summary"
      }`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${gKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Data } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message || "Gemini API Error");

        const rawJson = data.candidates[0].content.parts[0].text;
        const bottle = JSON.parse(rawJson);

        document.getElementById("b-name").value = bottle.name || "";
        document.getElementById("b-category").value = bottle.category || "Bourbon & American Whiskey";
        document.getElementById("b-sub").value = bottle.subCategory || "";
        document.getElementById("b-proof").value = bottle.proof || "";
        document.getElementById("b-size").value = bottle.size || "750 mL";
        document.getElementById("b-details").value = bottle.details || "";
        document.getElementById("b-notes").value = bottle.notes || "";
        document.getElementById("b-mash").value = bottle.mash || "";
        document.getElementById("b-barrel").value = bottle.barrel || "";

        bottleForm.style.display = "block";
        statusDisplay.className = "status-msg success";
        statusDisplay.textContent = "✓ Label analyzed! Check for matches below or edit details.";
        
        checkForSimilarBottles(bottle.name || "");
        bottleForm.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        console.error(err);
        statusDisplay.className = "status-msg error";
        statusDisplay.textContent = `Scan notice: ${err.message}. You can enter details manually below.`;
        bottleForm.style.display = "block";
      }
    }

    function checkForSimilarBottles(targetName) {
      const matchBox = document.getElementById("similar-matches-box");
      const list = document.getElementById("matches-list");
      if (!targetName || targetName.length < 3 || existingSpirits.length === 0) {
        matchBox.style.display = "none";
        return;
      }

      const cleanTarget = targetName.toLowerCase().replace(/[^a-z0-9]/g, " ");
      const words = cleanTarget.split(/\s+/).filter(w => w.length > 2);

      const matches = existingSpirits.map((item, idx) => {
        const cleanItem = (item.name || "").toLowerCase().replace(/[^a-z0-9]/g, " ");
        let score = 0;
        
        if (cleanItem === cleanTarget) score += 100;
        if (cleanItem.includes(cleanTarget) || cleanTarget.includes(cleanItem)) score += 50;
        words.forEach(w => {
          if (cleanItem.includes(w)) score += 10;
        });

        return { item, idx, score };
      }).filter(m => m.score >= 20).sort((a, b) => b.score - a.score).slice(0, 3);

      const currentInputSize = document.getElementById("b-size").value.trim() || "750 mL";

      if (matches.length > 0) {
        matchBox.style.display = "block";
        list.innerHTML = matches.map(m => {
          const currentSizesDesc = m.item.sizes ? Object.entries(m.item.sizes).map(([sz, c]) => `${c}× ${sz}`).join(", ") : `${m.item.quantity || 1}× ${m.item.size || '750 mL'}`;
          return `
          <div class="match-item">
            <div>
              <div class="match-name">${m.item.name}</div>
              <div class="match-sub">${m.item.category || ''} • Current: ${currentSizesDesc}</div>
            </div>
            <button type="button" class="btn-match-action" onclick="addSizeToExistingEntry(${m.idx})">➕ Add ${currentInputSize} to This Entry</button>
          </div>
        `}).join("");
      } else {
        matchBox.style.display = "none";
      }
    }

    window.addSizeToExistingEntry = async function(index) {
      const targetBottle = existingSpirits[index];
      const sizeToAdd = document.getElementById("b-size").value.trim() || "750 mL";
      const qtyToAdd = parseInt(document.getElementById("b-qty").value) || 1;

      if (!confirm(`Add ${qtyToAdd}× ${sizeToAdd} to existing card "${targetBottle.name}"?`)) return;

      const ghToken = getAuthToken();
      if (!ghToken) return;

      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;
      statusDisplay.className = "status-msg loading";
      statusDisplay.textContent = `Updating inventory for ${targetBottle.name}...`;

      try {
        const filePath = targetBottle.category === "Wine" ? "data/beer-wine.json" : "data/spirits.json";
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${filePath}`, {
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${ghToken}`
          }
        });
        const fileData = await getRes.json();
        const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        const cur = currentContent.items[index];
        if (!cur.sizes) {
          const oldSize = cur.size || "750 mL";
          const oldQty = cur.quantity || (cur.inStock ? 1 : 0);
          cur.sizes = { [oldSize]: oldQty };
        }

        cur.sizes[sizeToAdd] = (cur.sizes[sizeToAdd] || 0) + qtyToAdd;
        cur.quantity = Object.values(cur.sizes).reduce((a, b) => a + b, 0);
        cur.inStock = true;
        cur.size = Object.keys(cur.sizes).join(", ");

        const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));
        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${filePath}`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${ghToken}`
          },
          body: JSON.stringify({
            message: `Add ${qtyToAdd}x ${sizeToAdd} to ${cur.name}`,
            content: updatedBase64,
            sha: fileData.sha,
            branch: "main"
          })
        });

        if (putRes.ok) {
          statusDisplay.className = "status-msg success";
          statusDisplay.textContent = `✓ Successfully added ${sizeToAdd} to ${cur.name}!`;
          bottleForm.reset();
          preview.style.display = "none";
          bottleForm.style.display = "none";
          preloadInventory();
        } else {
          throw new Error("GitHub commit failed.");
        }
      } catch (err) {
        console.error(err);
        alert(`Error updating bottle: ${err.message}`);
      } finally {
        saveBtn.disabled = false;
      }
    };

    function getAuthToken() {
      let ghToken = document.getElementById("gh-token").value.trim();
      if (!ghToken) {
        const userSession = localStorage.getItem("decap-cms-user");
        ghToken = userSession ? JSON.parse(userSession).token : null;
      }
      if (!ghToken) {
        alert("GitHub Token not found. Please paste your GitHub Personal Access Token.");
      }
      return ghToken;
    }

    bottleForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      saveKeys();
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving New Card...";

      const ghToken = getAuthToken();
      if (!ghToken) {
        saveBtn.disabled = false;
        saveBtn.textContent = "✓ Save as New Card";
        return;
      }

      const inputCategory = document.getElementById("b-category").value;
      const isWine = inputCategory === "Wine";
      const targetFilePath = isWine ? "data/beer-wine.json" : "data/spirits.json";

      const inputSize = document.getElementById("b-size").value.trim() || (isWine ? "Bottle" : "750 mL");
      const inputQty = parseInt(document.getElementById("b-qty").value) || 1;

      const newBottle = {
        name: document.getElementById("b-name").value.trim(),
        category: inputCategory,
        subCategory: document.getElementById("b-sub").value.trim(),
        style: document.getElementById("b-sub").value.trim(),
        proof: document.getElementById("b-proof").value.trim(),
        abv: document.getElementById("b-proof").value.trim(),
        size: inputSize,
        sizes: { [inputSize]: inputQty },
        quantity: inputQty,
        details: document.getElementById("b-details").value.trim(),
        origin: document.getElementById("b-mash").value.trim(),
        isSpecial: document.getElementById("b-special").checked,
        isGifted: document.getElementById("b-gifted").checked,
        inStock: true,
        extra: {}
      };

      const notes = document.getElementById("b-notes").value.trim();
      const mash = document.getElementById("b-mash").value.trim();
      const barrel = document.getElementById("b-barrel").value.trim();
      const giftNotes = document.getElementById("b-giftnotes").value.trim();

      if (notes) newBottle.extra.notes = notes;
      if (mash) newBottle.extra.mash = mash;
      if (barrel) newBottle.extra.barrel = barrel;
      if (newBottle.isGifted && giftNotes) newBottle.extra.giftNotes = giftNotes;
      if (Object.keys(newBottle.extra).length === 0) delete newBottle.extra;

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${targetFilePath}`, {
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${ghToken}`
          }
        });
        const fileData = await getRes.json();
        const currentContent = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));

        currentContent.items.push(newBottle);

        const updatedBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2))));
        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${targetFilePath}`, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `Bearer ${ghToken}`
          },
          body: JSON.stringify({
            message: `Add ${newBottle.name} (${inputCategory}) as new card`,
            content: updatedBase64,
            sha: fileData.sha,
            branch: "main"
          })
        });

        if (putRes.ok) {
          statusDisplay.className = "status-msg success";
          statusDisplay.textContent = `✓ Successfully added ${newBottle.name} to the website!`;
          bottleForm.reset();
          preview.style.display = "none";
          bottleForm.style.display = "none";
          preloadInventory();
        } else {
          throw new Error("GitHub commit failed. Check your token permissions.");
        }
      } catch (err) {
        console.error(err);
        alert(`Error saving bottle to GitHub: ${err.message}`);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "✓ Save as New Card";
      }
    });
  </script>
</body>
</html>
