<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Damp Clam | Inventory Manager</title>
    <meta name="theme-color" content="#0f1424">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@300;400;600;800&display=swap');
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0d17;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-[#0f1424] border-b border-cyan-500/30 px-4 py-3 sticky top-0 z-30 shadow-lg shadow-cyan-950/40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-fuchsia-600 to-cyan-500 flex items-center justify-center font-extrabold text-white text-lg shadow-md shadow-fuchsia-500/50">
                    C
                </div>
                <div>
                    <h1 class="font-extrabold text-base text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500 tracking-wider">
                        THE DAMP CLAM
                    </h1>
                    <p class="text-[10px] text-slate-400 font-mono tracking-tight">Stock & Inventory Manager</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <a href="/" class="px-2.5 py-1 text-xs rounded border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-mono flex items-center gap-1">Menu</a>
                <button onclick="openTokenModal()" class="px-2.5 py-1 text-xs rounded border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-mono flex items-center gap-1">
                    <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                    <span>Token</span>
                </button>
                <button onclick="loadInventory()" class="p-1.5 rounded border border-cyan-500/40 bg-cyan-950/30 hover:bg-cyan-900/50 text-cyan-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.038 8.038 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">
        
        <!-- Controls: Search & Category Filter -->
        <div class="bg-[#0f1424]/90 border border-slate-800 rounded-xl p-3 space-y-3">
            <div class="relative">
                <input type="text" id="searchInput" oninput="renderItems()" placeholder="Search spirits, wine, beer, mixers..." 
                    class="w-full bg-[#0b0d17] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
            </div>
            
            <div class="flex items-center gap-2 overflow-x-auto pb-1 text-xs font-mono">
                <button onclick="setCategory('all')" class="cat-filter-btn px-3 py-1 rounded-full border border-cyan-500 bg-cyan-500/20 text-cyan-300 whitespace-nowrap" data-cat="all">All</button>
                <button onclick="setCategory('spirits')" class="cat-filter-btn px-3 py-1 rounded-full border border-slate-700 bg-slate-800/40 text-slate-400 whitespace-nowrap" data-cat="spirits">Spirits</button>
                <button onclick="setCategory('liqueurs')" class="cat-filter-btn px-3 py-1 rounded-full border border-slate-700 bg-slate-800/40 text-slate-400 whitespace-nowrap" data-cat="liqueurs">Liqueurs</button>
                <button onclick="setCategory('wine')" class="cat-filter-btn px-3 py-1 rounded-full border border-slate-700 bg-slate-800/40 text-slate-400 whitespace-nowrap" data-cat="wine">Wine</button>
                <button onclick="setCategory('mixers')" class="cat-filter-btn px-3 py-1 rounded-full border border-slate-700 bg-slate-800/40 text-slate-400 whitespace-nowrap" data-cat="mixers">Mixers</button>
            </div>
        </div>

        <!-- Notification Banner -->
        <div id="statusToast" class="hidden rounded-lg p-3 text-xs font-mono border transition-all"></div>

        <!-- Inventory List -->
        <div id="inventoryContainer" class="space-y-2">
            <div class="text-center py-12 text-slate-500 font-mono text-sm">
                Loading inventory from GitHub...
            </div>
        </div>

    </main>

    <!-- GitHub Token Modal -->
    <div id="tokenModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0f1424] border border-slate-800 rounded-xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div>
                <h3 class="font-bold text-base text-cyan-400">GitHub Access Token</h3>
                <p class="text-xs text-slate-400 mt-1">Requires a Personal Access Token (PAT) with <code class="text-fuchsia-400">repo</code> and <code class="text-fuchsia-400">workflow</code> permissions.</p>
            </div>
            <div>
                <input type="password" id="tokenInput" placeholder="github_pat_xxxx or ghp_xxxx" 
                    class="w-full bg-[#0b0d17] border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 font-mono focus:outline-none focus:border-cyan-500">
            </div>
            <div class="flex justify-end gap-2 text-xs font-mono">
                <button onclick="closeTokenModal()" class="px-4 py-2 rounded border border-slate-700 text-slate-400 hover:bg-slate-800">Cancel</button>
                <button onclick="saveToken()" class="px-4 py-2 rounded bg-gradient-to-r from-fuchsia-600 to-cyan-500 text-white font-bold">Save Token</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const REPO_OWNER = 'thedampclam';
        const REPO_NAME = 'TheDampClamBarMenu';
        const FILE_PATH = 'spirits.json';
        const BRANCH = 'main';

        let inventory = [];
        let activeCategory = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('dampclam_pat');
            if (!token) {
                openTokenModal();
            } else {
                loadInventory();
            }
        });

        function showStatus(message, isError = false) {
            const toast = document.getElementById('statusToast');
            toast.className = `rounded-lg p-3 text-xs font-mono border transition-all ${
                isError 
                ? 'bg-rose-950/80 border-rose-600 text-rose-200' 
                : 'bg-cyan-950/80 border-cyan-600 text-cyan-200'
            }`;
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 4000);
        }

        function openTokenModal() {
            document.getElementById('tokenInput').value = localStorage.getItem('dampclam_pat') || '';
            document.getElementById('tokenModal').classList.remove('hidden');
        }

        function closeTokenModal() {
            document.getElementById('tokenModal').classList.add('hidden');
        }

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (token) {
                localStorage.setItem('dampclam_pat', token);
                closeTokenModal();
                showStatus('Access Token stored locally.');
                loadInventory();
            }
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = 'cat-filter-btn px-3 py-1 rounded-full border border-cyan-500 bg-cyan-500/20 text-cyan-300 whitespace-nowrap';
                } else {
                    btn.className = 'cat-filter-btn px-3 py-1 rounded-full border border-slate-700 bg-slate-800/40 text-slate-400 whitespace-nowrap';
                }
            });
            renderItems();
        }

        function getAuthHeader(token) {
            if (!token) return '';
            return token.startsWith('Bearer ') || token.startsWith('token ') ? token : `token ${token}`;
        }

        async function loadInventory() {
            const token = localStorage.getItem('dampclam_pat');
            const container = document.getElementById('inventoryContainer');
            container.innerHTML = `<div class="text-center py-12 text-slate-500 font-mono text-sm">Syncing latest stock from GitHub...</div>`;

            try {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}?ref=${BRANCH}&_t=${Date.now()}`;
                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                    'Cache-Control': 'no-cache, no-store, must-revalidate'
                };
                if (token) {
                    headers['Authorization'] = getAuthHeader(token);
                }

                const res = await fetch(url, { headers });

                if (res.status === 401 || res.status === 403) {
                    throw new Error('Access denied. Please check your Personal Access Token in settings.');
                }
                if (!res.ok) {
                    throw new Error(`GitHub API Error: ${res.status} ${res.statusText}`);
                }

                const data = await res.json();
                const binString = atob(data.content.replace(/\s/g, ''));
                const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
                const decodedJson = new TextDecoder().decode(bytes);
                
                inventory = JSON.parse(decodedJson);
                renderItems();
                showStatus('Inventory loaded successfully.');
            } catch (err) {
                container.innerHTML = `<div class="bg-rose-950/40 border border-rose-800 rounded-xl p-6 text-center text-rose-300 font-mono text-xs">${err.message}</div>`;
                showStatus(err.message, true);
            }
        }

        function renderItems() {
            const container = document.getElementById('inventoryContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = inventory.filter(item => {
                const matchesCat = (activeCategory === 'all') || (item.category && item.category.toLowerCase() === activeCategory.toLowerCase());
                const matchesSearch = item.name.toLowerCase().includes(query) || (item.brand && item.brand.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-600 font-mono text-sm">No items found matching criteria.</div>`;
                return;
            }

            container.innerHTML = filtered.map((item, idx) => {
                const inStock = item.in_stock !== false;
                return `
                    <div class="bg-[#0f1424] border ${inStock ? 'border-slate-800' : 'border-rose-900/40 opacity-60'} rounded-xl p-3.5 flex items-center justify-between gap-3 shadow-sm transition-all">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h4 class="font-bold text-sm text-slate-100 truncate">${item.name}</h4>
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded ${inStock ? 'bg-emerald-950/80 text-emerald-300 border border-emerald-800' : 'bg-rose-950/80 text-rose-300 border border-rose-800'}">
                                    ${inStock ? 'IN STOCK' : 'OUT'}
                                </span>
                            </div>
                            <p class="text-xs text-slate-400 truncate mt-0.5">${item.brand || item.category || 'Bar Supply'}</p>
                        </div>
                        <button onclick="toggleStock('${item.name.replace(/'/g, "\\'")}')" 
                            class="px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition-all border ${
                                inStock 
                                ? 'bg-rose-950/50 hover:bg-rose-900 border-rose-700/50 text-rose-300' 
                                : 'bg-emerald-950/50 hover:bg-emerald-900 border-emerald-700/50 text-emerald-300'
                            }">
                            ${inStock ? 'Mark Out' : 'Restock'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        async function commitInventoryToGitHub(updatedInventory, commitMessage) {
            const token = localStorage.getItem('dampclam_pat');
            if (!token) {
                openTokenModal();
                throw new Error('Personal Access Token required for saving changes.');
            }
            const repoUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

            // 1. Get freshest SHA immediately before committing
            const getRes = await fetch(`${repoUrl}?ref=${BRANCH}&_t=${Date.now()}`, {
                headers: {
                    'Authorization': getAuthHeader(token),
                    'Accept': 'application/vnd.github.v3+json',
                    'Cache-Control': 'no-cache, no-store, must-revalidate'
                }
            });

            if (!getRes.ok) {
                const err = await getRes.json();
                throw new Error(err.message || 'Failed to query latest repository file state.');
            }

            const fileMeta = await getRes.json();
            const freshSha = fileMeta.sha;

            // 2. UTF-8 Safe Base64 Encoding
            const utf8Bytes = new TextEncoder().encode(JSON.stringify(updatedInventory, null, 2));
            const binaryStr = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join('');
            const base64Content = btoa(binaryStr);

            // 3. PUT Commit
            const putRes = await fetch(repoUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': getAuthHeader(token),
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: base64Content,
                    sha: freshSha,
                    branch: BRANCH
                })
            });

            if (!putRes.ok) {
                const err = await putRes.json();
                throw new Error(err.message || 'GitHub commit rejected.');
            }

            return await putRes.json();
        }

        async function toggleStock(itemName) {
            const target = inventory.find(i => i.name === itemName);
            if (!target) return;

            const previousState = target.in_stock;
            target.in_stock = (target.in_stock === false) ? true : false;
            
            renderItems();
            showStatus(`Updating ${itemName}...`);

            try {
                await commitInventoryToGitHub(inventory, `Update stock status for ${itemName}`);
                showStatus(`Saved: ${itemName} is now ${target.in_stock ? 'In Stock' : 'Out of Stock'}`);
            } catch (err) {
                target.in_stock = previousState;
                renderItems();
                showStatus(`Failed: ${err.message}`, true);
            }
        }
    </script>
</body>
</html>
