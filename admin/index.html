<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Damp Clam — Content Manager</title>
  <link rel="icon" type="image/jpeg" href="../logo.jpg" />
  <link rel="stylesheet" href="admin.css" />

  <style>
    #token-login-modal {
      position: fixed;
      inset: 0;
      background: rgba(3, 20, 15, 0.94);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: "Georgia", Times, serif;
    }
    .modal-box {
      background: #0d2822;
      border: 1px solid #00f7ff;
      border-radius: 12px;
      padding: 2.25rem 2rem;
      width: 90%;
      max-width: 440px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 25px rgba(0, 247, 255, 0.25);
    }
    .modal-box h2 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
    }
    .modal-box p {
      font-size: 0.85rem;
      color: #e5b567;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .modal-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #16382c;
      background: #01130d;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-box input:focus {
      outline: none;
      border-color: #00f7ff;
      box-shadow: 0 0 10px rgba(0, 247, 255, 0.4);
    }
    .modal-box button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 20px;
      border: none;
      background: #00f7ff;
      color: #03140f;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 247, 255, 0.4);
      transition: all 0.2s ease;
    }
    .modal-box button:hover {
      background: #fff;
      box-shadow: 0 0 18px rgba(0, 247, 255, 0.8);
    }
    <a href="scanner.html" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #00f7ff; color: #03140f; padding: 10px 18px; border-radius: 25px; text-decoration: none; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; box-shadow: 0 0 15px rgba(0,247,255,0.5);">📷 AI Scanner</a>
  </style>
</head>
<body>
  <div id="token-login-modal">
    <div class="modal-box">
      <h2>The Damp Clam Admin</h2>
      <p>Enter your GitHub Personal Access Token to unlock your bar inventory and menus.</p>
      <input type="password" id="gh-token-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      <button id="gh-token-save-btn">Enter Dashboard</button>
    </div>
  </div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    (function() {
      // Re-inject custom CSS link on render to guarantee priority over Emotion CSS
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "admin.css?" + Date.now();
      document.head.appendChild(link);

      const STORAGE_KEY = "decap-cms-user";
      const user = localStorage.getItem(STORAGE_KEY);

      if (!user || !JSON.parse(user).token) {
        const modal = document.getElementById("token-login-modal");
        modal.style.display = "flex";

        document.getElementById("gh-token-save-btn").addEventListener("click", function() {
          const token = document.getElementById("gh-token-input").value.trim();
          if (token) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ token: token, backendName: "github" }));
            modal.style.display = "none";
            window.location.reload();
          }
        });
      }
    })();
  </script>
</body>
</html>
