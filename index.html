<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Damp Clam | Speakeasy Cocktail Menu</title>
    <meta name="theme-color" content="#0a0a0c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-card: #121318;
            --border-color: #262836;
            --accent-gold: #d4af37;
            --accent-gold-dim: rgba(212, 175, 55, 0.15);
            --text-main: #e2e8f0;
            --text-muted: #8e95a5;
            --status-green: #10b981;
            --status-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .font-speakeasy {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.08em;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Header */
        header {
            background: linear-gradient(180deg, #14151e 0%, rgba(10, 10, 12, 0.95) 100%);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding: 20px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
        }

        .brand-title {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            text-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Container */
        main {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Search & Filter Bar */
        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            background: #0a0a0c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent-gold);
        }

        .category-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: #181922;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: var(--accent-gold-dim);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* Spirits List */
        .spirits-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .spirit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .spirit-card.out-of-stock {
            opacity: 0.45;
            border-color: rgba(239, 68, 68, 0.2);
        }

        .spirit-info {
            flex: 1;
            min-width: 0;
        }

        .spirit-name {
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spirit-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .spirit-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .status-indicator {
            font-size: 0.65rem;
            font-family: 'JetBrains Mono', monospace;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .status-indicator.in {
            background: rgba(16, 185, 129, 0.1);
            color: var(--status-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-indicator.out {
            background: rgba(239, 68, 68, 0.1);
            color: var(--status-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 28px 16px 20px;
            border-top: 1px solid rgba(38, 40, 54, 0.6);
            text-align: center;
        }

        .footer-staff-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            opacity: 0.6;
            transition: all 0.2s;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .footer-staff-link:hover, .footer-staff-link:active {
            opacity: 1;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1 class="brand-title font-speakeasy">The Damp Clam</h1>
        <p class="brand-subtitle font-mono">Curated Spirits & Cocktails</p>
    </header>

    <!-- Main Content -->
    <main>
        <div class="search-box">
            <input type="text" id="menuSearch" class="search-input" placeholder="Search spirits, cocktails, brands..." oninput="renderMenu()">
            <div class="category-nav" id="categoryNav">
                <button class="cat-chip active" onclick="filterCategory('all')">ALL</button>
            </div>
        </div>

        <div id="menuContainer" class="spirits-grid">
            <div style="text-align:center; padding: 40px 0; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;">
                Pouring spirits menu...
            </div>
        </div>
    </main>

    <!-- Footer with Staff Portal Access -->
    <footer>
        <a href="manager.html" class="footer-staff-link">
            <span>🔒 Staff Portal</span>
        </a>
    </footer>

    <script>
        let menuItems = [];
        let selectedCategory = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            fetchMenu();
        });

        async function fetchMenu() {
            const container = document.getElementById('menuContainer');
            try {
                const res = await fetch(`./spirits.json?_t=${Date.now()}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const data = await res.json();
                normalizeMenuData(data);
                renderMenu();
            } catch (err) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 30px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;">
                        Menu temporarily offline. Please ask your bartender.
                    </div>
                `;
            }
        }

        function normalizeMenuData(data) {
            menuItems = [];
            if (Array.isArray(data)) {
                menuItems = data;
            } else if (typeof data === 'object' && data !== null) {
                Object.keys(data).forEach(cat => {
                    if (Array.isArray(data[cat])) {
                        data[cat].forEach(item => {
                            menuItems.push({
                                ...item,
                                category: item.category || cat
                            });
                        });
                    }
                });
            }
            buildCategories();
        }

        function buildCategories() {
            const categories = ['all', ...new Set(menuItems.map(i => i.category || 'Other').filter(Boolean))];
            const nav = document.getElementById('categoryNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-chip ${cat === selectedCategory ? 'active' : ''}" onclick="filterCategory('${cat}')">
                    ${cat.toUpperCase()}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            buildCategories();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const search = document.getElementById('menuSearch').value.toLowerCase();

            const filtered = menuItems.filter(item => {
                const cat = (item.category || 'Other').toLowerCase();
                const matchCat = (selectedCategory === 'all') || (cat === selectedCategory.toLowerCase());
                const matchSearch = (item.name && item.name.toLowerCase().includes(search)) ||
                                    (item.brand && item.brand.toLowerCase().includes(search)) ||
                                    (item.type && item.type.toLowerCase().includes(search));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 40px 0; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;">No selections available.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const inStock = item.in_stock !== false;
                const desc = item.brand || item.type || item.category || 'House Selection';

                return `
                    <div class="spirit-card ${inStock ? '' : 'out-of-stock'}">
                        <div class="spirit-info">
                            <div class="spirit-name">${item.name || 'Unnamed Bottle'}</div>
                            <div class="spirit-meta">
                                <span class="spirit-tag">${desc}</span>
                            </div>
                        </div>
                        <span class="status-indicator ${inStock ? 'in' : 'out'}">
                            ${inStock ? 'Available' : 'Out'}
                        </span>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
