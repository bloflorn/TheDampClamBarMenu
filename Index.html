<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Damp Clam Inventory</title>
  <style>
    :root {
      /* Speakeasy Theme Colors */
      --bg-gradient: linear-gradient(135deg, #0d2822 0%, #03140f 100%);
      --card-bg: rgba(2, 22, 17, 0.75);
      
      /* Neon Accent Palette */
      --neon-cyan: #00f7ff;
      --neon-green: #39ff14;
      --neon-purple: #c042ff;
      --neon-pink: #ff2a8d;
      --neon-gold: #ffd700;
      --gold-amber: #e5b567;
      --off-white: #f8fafc;
      --border: #16382c;

      --font: "Georgia", Times, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--off-white);
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Header & Circular Masked Neon Clam Sign */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .logo-circle-container {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      padding: 3px;
      background: radial-gradient(circle, rgba(0, 247, 255, 0.25) 0%, transparent 70%);
      border: 2px solid var(--neon-cyan);
      box-shadow: 
        0 0 10px var(--neon-cyan),
        0 0 25px rgba(0, 247, 255, 0.45),
        inset 0 0 12px var(--neon-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .logo-circle-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    h1 {
      font-size: clamp(1.8rem, 7vw, 2.75rem);
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: center;
      width: 100%;
      line-height: 1.15;
      padding-left: 0.12em;
      text-shadow: 
        0 0 5px #fff,
        0 0 10px #fff,
        0 0 20px var(--neon-cyan),
        0 0 35px var(--neon-purple);
    }

    .header-subtext {
      font-family: var(--font);
      font-size: clamp(0.75rem, 3vw, 0.95rem);
      color: var(--gold-amber);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      text-align: center;
      width: 100%;
      padding-left: 0.2em;
    }

    .stats {
      font-size: 0.9rem;
      color: var(--gold-amber);
      background: var(--card-bg);
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      border: 1px solid var(--gold-amber);
      margin-top: 0.5rem;
    }

    .stats strong {
      color: #fff;
    }

    /* Controls & Search */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .search-bar {
      width: 100%;
      max-width: 480px;
      padding: 0.75rem 1.25rem;
      border-radius: 25px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
      color: var(--off-white);
      font-size: 0.9rem;
      text-align: center;
      font-family: inherit;
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px rgba(0, 247, 255, 0.5);
    }

    /* Main Category Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
    }

    .filter-btn {
      background: transparent;
      color: var(--gold-amber);
      border: 1px solid var(--gold-amber);
      padding: 0.45rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: inherit;
      transition: all 0.2s ease-in-out;
    }

    .filter-btn:hover {
      background: rgba(229, 181, 103, 0.12);
    }

    .filter-btn.active {
      background: rgba(0, 247, 255, 0.1);
      color: var(--neon-cyan);
      border-color: var(--neon-cyan);
      box-shadow: 
        0 0 5px rgba(0, 247, 255, 0.6),
        0 0 12px rgba(0, 247, 255, 0.3);
    }

    /* Subcategory Filter Pill Row */
    .subfilters {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      width: 100%;
      padding-top: 0.25rem;
      animation: fadeIn 0.25s ease-in-out;
    }

    .subfilters.visible {
      display: flex;
    }

    .subfilter-btn {
      background: rgba(0, 0, 0, 0.25);
      color: #94a3b8;
      border: 1px solid #1e4a3b;
      padding: 0.3rem 0.85rem;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: inherit;
      transition: all 0.2s ease-in-out;
    }

    .subfilter-btn:hover {
      color: var(--neon-green);
      border-color: var(--neon-green);
    }

    .subfilter-btn.active {
      background: rgba(57, 255, 20, 0.12);
      color: var(--neon-green);
      border-color: var(--neon-green);
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
    }

    /* Educational / Category Info Sub-Header Panel */
    .category-header-panel {
      background: rgba(2, 22, 17, 0.85);
      border: 1px solid var(--border);
      border-left: 4px solid var(--neon-cyan);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      line-height: 1.6;
      animation: fadeIn 0.3s ease-in-out;
    }

    .category-header-panel.sub-panel {
      border-left-color: var(--neon-green);
    }

    .category-header-panel.special-panel {
      border-left-color: var(--neon-gold);
    }

    .category-header-panel.gifted-panel {
      border-left-color: var(--neon-pink);
    }

    .panel-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .panel-desc {
      font-size: 0.88rem;
      color: #e2e8f0;
    }

    /* Card Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
    }

    .card.interactive {
      cursor: pointer;
    }

    .card.interactive:hover {
      border-color: rgba(0, 247, 255, 0.5);
      box-shadow: 0 0 18px rgba(0, 247, 255, 0.25);
    }

    /* Special Bottle Card Highlighting */
    .card.is-special {
      border-color: rgba(255, 215, 0, 0.45);
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.12);
      background: linear-gradient(145deg, rgba(20, 36, 26, 0.85) 0%, rgba(2, 22, 17, 0.9) 100%);
    }

    .card.is-special.interactive:hover {
      border-color: var(--neon-gold);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      gap: 0.5rem;
    }

    .card-badges-left {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .card-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--neon-pink);
      font-weight: bold;
    }

    .card-subcategory {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--neon-green);
      border: 1px solid rgba(57, 255, 20, 0.4);
      background: rgba(57, 255, 20, 0.08);
      padding: 1px 6px;
      border-radius: 8px;
    }

    .badge-gifted {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--neon-pink);
      border: 1px solid rgba(255, 42, 141, 0.6);
      background: rgba(255, 42, 141, 0.12);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 42, 141, 0.5);
    }

    .badge-special {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--neon-gold);
      border: 1px solid rgba(255, 215, 0, 0.6);
      background: rgba(255, 215, 0, 0.12);
      padding: 1px 7px;
      border-radius: 10px;
      font-weight: bold;
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
    }

    .badge-expand {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 247, 255, 0.4);
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 247, 255, 0.08);
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .card.expanded .badge-expand {
      background: rgba(0, 247, 255, 0.2);
      border-color: var(--neon-cyan);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.85rem;
      line-height: 1.3;
    }

    .card-details {
      font-size: 0.85rem;
      color: var(--off-white);
      line-height: 1.5;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }

    .card-details div {
      margin-bottom: 0.35rem;
    }

    .card-details strong {
      color: var(--gold-amber);
      font-weight: 600;
    }

    /* Extended Interactive Section */
    .extra-details {
      display: none;
      margin-top: 0.6rem;
      padding-top: 0.6rem;
      border-top: 1px dashed rgba(229, 181, 103, 0.3);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      padding: 0.6rem;
      animation: fadeIn 0.25s ease-in-out;
    }

    .card.expanded .extra-details {
      display: block;
    }

    .extra-item {
      font-size: 0.8rem;
      line-height: 1.45;
      margin-bottom: 0.35rem;
      color: #e2e8f0;
    }

    .extra-item strong {
      color: var(--neon-cyan);
    }

    .extra-item.gift-highlight {
      background: rgba(255, 42, 141, 0.08);
      border-left: 2px solid var(--neon-pink);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.45rem;
    }

    .extra-item.gift-highlight strong {
      color: var(--neon-pink);
    }

    .extra-item.special-highlight {
      background: rgba(255, 215, 0, 0.08);
      border-left: 2px solid var(--neon-gold);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.45rem;
    }

    .extra-item.special-highlight strong {
      color: var(--neon-gold);
    }

    .tasting-notes {
      font-style: italic;
      color: #cbd5e1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--gold-amber);
      grid-column: 1 / -1;
      font-size: 1.1rem;
    }
  </style>
</head>

          notes: "Bright floral juniper, gentle warm citrus, delicate earthiness, natural indigo color-changing profile."
        }
      },
      { 
        name: "Fireball Cinnamon Whisky", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Liqueur",
        proof: "66 Proof (33% ABV)", 
        size: "750 mL", 
        details: "Whisky with Natural Cinnamon Flavor",
        isSpecial: false,
        isGifted: false 
      },
      { 
        name: "Kirkland Signature American Vodka", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Vodka",
        proof: "80 Proof (40% ABV)", 
        size: "1.75 L", 
        details: "Distilled Six Times, Gluten Free",
        isSpecial: false,
        isGifted: false 
      },
      { 
        name: "Mr. Boston Blue Curaçao Liqueur", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Liqueur",
        proof: "30 Proof (15% ABV)", 
        size: "750 mL", 
        details: "Master Mixologist Series",
        isSpecial: false,
        isGifted: false 
      },
      { 
        name: "Smirnoff Peppermint Twist Limited Edition", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Flavored Vodka",
        proof: "60 Proof (30% ABV)", 
        size: "750 mL", 
        details: "Vodka with Peppermint, Scratch & Sniff Bottle",
        isSpecial: false,
        isGifted: false 
      },
      { 
        name: "St. Elder Natural Elderflower Liqueur", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Liqueur",
        proof: "40 Proof (20% ABV)", 
        size: "750 mL", 
        details: "Natural Premium Artisanal Liqueur",
        isSpecial: false,
        isGifted: false 
      },
      { 
        name: "The Botanist Islay Dry Gin", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Dry Gin",
        proof: "92 Proof (46% ABV)", 
        size: "750 mL", 
        details: "22 Foraged Island Botanicals, Bruichladdich",
        isSpecial: false,
        isGifted: false,
        extra: {
          botanicals: "22 hand-foraged wild Islay herbs, flowers, and lichens (Bruichladdich Ugly Betty pot still)",
          notes: "Sweet delicate menthol, apple mint, spring woodlands, coriander, citrus anise, and herbal juniper."
        }
      },
      { 
        name: "UV Blue Raspberry Flavored Vodka", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Flavored Vodka",
        proof: "60 Proof (30% ABV)", 
        size: "750 mL", 
        details: "Raspberry Flavored Vodka",
        isSpecial: false,
        isGifted: false 
      },
      { 
        name: "Crown Royal Blackberry Flavored Whisky", 
        category: "Gin, Vodka & Liqueurs", 
        subCategory: "Flavored Whisky",
        proof: "70 Proof (35% ABV)", 
        size: "750 mL", 
        details: "Limited Edition Summer Release",
        isSpecial: false,
        isGifted: false 
      }
    ];

    let currentCategory = "All";
    let currentSubCategory = "All";
    let searchQuery = "";

    function init() {
      renderFilters();
      renderSubFilters();
      renderCategoryHeader();
      renderGrid();
    }

    function renderFilters() {
      const definedCategories = [
        "All",
        "Bourbon & American Whiskey",
        "Scotch Whisky",
        "Irish Whiskey",
        "Rum & Aquavit",
        "Gin, Vodka & Liqueurs",
        "Special Bottles"
      ];

      const container = document.getElementById("filterContainer");
      container.innerHTML = definedCategories
        .map(
          (cat) => `<button class="filter-btn ${cat === currentCategory ? "active" : ""}" data-category="${cat}">${cat}</button>`
        )
        .join("");

      container.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.category;
          currentSubCategory = "All";
          renderFilters();
          renderSubFilters();
          renderCategoryHeader();
          renderGrid();
        });
      });
    }

    function renderSubFilters() {
      const subContainer = document.getElementById("subFilterContainer");

      if (currentCategory === "All") {
        subContainer.className = "subfilters";
        subContainer.innerHTML = "";
        return;
      }

      const subList = new Set();
      inventory.forEach((item) => {
        let inView = false;
        if (currentCategory === "Special Bottles") {
          inView = item.isSpecial;
        } else {
          inView = item.category === currentCategory;
        }

        if (inView && item.subCategory) {
          subList.add(item.subCategory);
        }
        if (inView && item.isGifted) {
          subList.add("Gifted Bottles");
        }
      });

      if (subList.size <= 1 && !subList.has("Gifted Bottles")) {
        subContainer.className = "subfilters";
        subContainer.innerHTML = "";
        return;
      }

      const subs = ["All", ...Array.from(subList).sort()];
      subContainer.className = "subfilters visible";
      subContainer.innerHTML = subs
        .map(
          (sub) => `<button class="subfilter-btn ${sub === currentSubCategory ? "active" : ""}" data-subcategory="${sub}">${sub}</button>`
        )
        .join("");

      subContainer.querySelectorAll(".subfilter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          currentSubCategory = btn.dataset.subcategory;
          renderSubFilters();
          renderCategoryHeader();
          renderGrid();
        });
      });
    }

    function renderCategoryHeader() {
      const headerContainer = document.getElementById("categoryHeaderContainer");

      // Gifted Bottles subcategory banner
      if (currentSubCategory === "Gifted Bottles") {
        const giftedInfo = categoryInfo["Gifted Bottles"];
        headerContainer.innerHTML = `
          <div class="category-header-panel gifted-panel">
            <div class="panel-title">${giftedInfo.title}</div>
            <div class="panel-desc">${giftedInfo.desc}</div>
          </div>
        `;
        return;
      }

      if (currentCategory === "All" || !categoryInfo[currentCategory]) {
        headerContainer.innerHTML = "";
        return;
      }

      const catObj = categoryInfo[currentCategory];
      const isSpecial = currentCategory === "Special Bottles";

      // Top-level "All" selected: Show Main Category Description
      if (currentSubCategory === "All") {
        headerContainer.innerHTML = `
          <div class="category-header-panel ${isSpecial ? "special-panel" : ""}">
            <div class="panel-title">${catObj.title}</div>
            <div class="panel-desc">${catObj.desc}</div>
          </div>
        `;
        return;
      }

      // Specific Subcategory selected: Show Dedicated Subcategory Description
      if (catObj.subs && catObj.subs[currentSubCategory]) {
        headerContainer.innerHTML = `
          <div class="category-header-panel sub-panel">
            <div class="panel-title">${currentSubCategory}</div>
            <div class="panel-desc">${catObj.subs[currentSubCategory]}</div>
          </div>
        `;
      } else {
        headerContainer.innerHTML = "";
      }
    }

    function renderGrid() {
      const grid = document.getElementById("inventoryGrid");
      
      const filtered = inventory.filter((item) => {
        let matchesCategory = false;
        if (currentCategory === "All") {
          matchesCategory = true;
        } else if (currentCategory === "Special Bottles") {
          matchesCategory = item.isSpecial === true;
        } else {
          matchesCategory = item.category === currentCategory;
        }

        let matchesSub = false;
        if (currentSubCategory === "All") {
          matchesSub = true;
        } else if (currentSubCategory === "Gifted Bottles") {
          matchesSub = item.isGifted === true;
        } else {
          matchesSub = item.subCategory === currentSubCategory;
        }

        const extraText = item.extra ? Object.values(item.extra).join(" ") : "";
        const specialText = item.isSpecial ? "special bottle" : "";
        const giftedText = item.isGifted ? "gifted bottle gift" : "";
        const subCatText = item.subCategory || "";
        const fullText = `${item.name} ${item.category} ${subCatText} ${item.proof} ${item.size} ${item.details} ${extraText} ${specialText} ${giftedText}`.toLowerCase();
        const matchesSearch = fullText.includes(searchQuery.toLowerCase());
        
        return matchesCategory && matchesSub && matchesSearch;
      });

      document.getElementById("totalCount").innerHTML = `Inventory Bottles: <strong>${inventory.length}</strong>`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching spirits found for '${currentSubCategory !== 'All' ? currentSubCategory : currentCategory}'.</div>`;
        return;
      }

      grid.innerHTML = filtered
        .map((item) => {
          const hasExtra = !!item.extra;
          const specialClass = item.isSpecial ? "is-special" : "";

          let extraHtml = "";
          if (hasExtra) {
            extraHtml = `
              <div class="extra-details">
                ${item.extra.giftNotes ? `<div class="extra-item gift-highlight"><strong>Gift Story:</strong> ${item.extra.giftNotes}</div>` : ""}
                ${item.extra.specialNotes ? `<div class="extra-item special-highlight"><strong>Special Note:</strong> ${item.extra.specialNotes}</div>` : ""}
                ${item.extra.bottle ? `<div class="extra-item"><strong>Bottle Number:</strong> ${item.extra.bottle}</div>` : ""}
                ${item.extra.barrel ? `<div class="extra-item"><strong>Barrel / Cask:</strong> ${item.extra.barrel}</div>` : ""}
                ${item.extra.cask ? `<div class="extra-item"><strong>Cask Type:</strong> ${item.extra.cask}</div>` : ""}
                ${item.extra.staves ? `<div class="extra-item"><strong>Stave Profile:</strong> ${item.extra.staves}</div>` : ""}
                ${item.extra.date ? `<div class="extra-item"><strong>Date / Selection:</strong> ${item.extra.date}</div>` : ""}
                ${item.extra.id ? `<div class="extra-item"><strong>Selection ID:</strong> ${item.extra.id}</div>` : ""}
                ${item.extra.mash ? `<div class="extra-item"><strong>Mashbill:</strong> ${item.extra.mash}</div>` : ""}
                ${item.extra.grain ? `<div class="extra-item"><strong>Grain / Mash:</strong> ${item.extra.grain}</div>` : ""}
                ${item.extra.aging ? `<div class="extra-item"><strong>Aging:</strong> ${item.extra.aging}</div>` : ""}
                ${item.extra.distillation ? `<div class="extra-item"><strong>Distillation / Production:</strong> ${item.extra.distillation}</div>` : ""}
                ${item.extra.specs ? `<div class="extra-item"><strong>Specifications:</strong> ${item.extra.specs}</div>` : ""}
                ${item.extra.distiller ? `<div class="extra-item"><strong>Distiller:</strong> ${item.extra.distiller}</div>` : ""}
                ${item.extra.botanicals ? `<div class="extra-item"><strong>Botanicals:</strong> ${item.extra.botanicals}</div>` : ""}
                ${item.extra.notes ? `<div class="extra-item tasting-notes"><strong>Tasting Notes:</strong> ${item.extra.notes}</div>` : ""}
              </div>
            `;
          }

          return `
            <div class="card ${specialClass} ${hasExtra ? 'interactive' : ''}" ${hasExtra ? `onclick="toggleCard(this)"` : ''}>
              <div>
                <div class="card-top">
                  <div class="card-badges-left">
                    <span class="card-category">${item.category}</span>
                    ${item.subCategory ? `<span class="card-subcategory">${item.subCategory}</span>` : ''}
                    ${item.isGifted ? `<span class="badge-gifted">🎁 Gifted</span>` : ''}
                    ${item.isSpecial ? `<span class="badge-special">★ Special Bottle</span>` : ''}
                  </div>
                  ${hasExtra ? `<span class="badge-expand">+ Details</span>` : ''}
                </div>
                <div class="card-title">${item.name}</div>
              </div>
              <div class="card-details">
                <div><strong>Proof / ABV:</strong> ${item.proof}</div>
                <div><strong>Size:</strong> ${item.size}</div>
                <div><strong>Details:</strong> ${item.details}</div>
                ${extraHtml}
              </div>
            </div>
          `;
        })
        .join("");
    }

    function toggleCard(cardElement) {
      const isExpanded = cardElement.classList.toggle('expanded');
      const badge = cardElement.querySelector('.badge-expand');
      if (badge) {
        badge.textContent = isExpanded ? '− Less' : '+ Details';
      }
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderGrid();
    });

    init();
  </script>
</body>
</html>
